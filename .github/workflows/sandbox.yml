name: Sandbox – Gaston permits

on:
  workflow_dispatch:
    inputs:
      days:
        description: "How many days back"
        default: "30"

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python sandbox/gaston_permits.py "${{ inputs.days }}"
      - uses: actions/upload-artifact@v4
        with:
          name: gaston-sandbox-report
          path: sandbox/output/
